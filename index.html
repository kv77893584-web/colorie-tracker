<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Счётчик калорий</title>
<style>
  :root{
    --bg:#F7F5EF; --panel:#FFFFFF; --ink:#28322B; --sub:#6B7A6F;
    --accent:#4F7A5C; --accent-soft:#DCEAE0; --warn:#C9622B; --line:#E4E0D5;
    --danger:#B3402F;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1F1C; --panel:#242923; --ink:#EDEFE9; --sub:#9BAA9E;
      --accent:#7FB08F; --accent-soft:#2E3A31; --line:#333A32; --warn:#E08A54; --danger:#E37F6C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1F1C; --panel:#242923; --ink:#EDEFE9; --sub:#9BAA9E;
    --accent:#7FB08F; --accent-soft:#2E3A31; --line:#333A32; --warn:#E08A54; --danger:#E37F6C;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:28px 18px 60px;}
  h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.2px;}
  .sub{color:var(--sub);font-size:14px;margin:0 0 22px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .goal-input{display:flex;align-items:center;gap:8px;}
  .goal-input input{width:90px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;}
  .progress-num{font-size:38px;font-weight:700;line-height:1;}
  .progress-label{color:var(--sub);font-size:13px;margin-top:4px;}
  .bar{height:10px;border-radius:6px;background:var(--accent-soft);overflow:hidden;margin-top:14px;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s ease;}
  .bar-fill.over{background:var(--danger);}
  form.add{display:flex;gap:8px;margin-top:4px;}
  form.add input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;min-width:0;}
  form.add input.cal{flex:0 0 90px;}
  form.add button{padding:10px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  form.add button:active{opacity:.85;}
  ul.log{list-style:none;margin:14px 0 0;padding:0;}
  ul.log li{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:15px;}
  ul.log li:first-child{border-top:none;}
  ul.log .name{flex:1;}
  ul.log .cal-val{color:var(--sub);margin-right:10px;}
  ul.log button.del{background:none;border:none;color:var(--sub);cursor:pointer;font-size:15px;padding:0 2px;}
  .empty{color:var(--sub);font-size:14px;padding:6px 0;}
  h2{font-size:14px;text-transform:none;color:var(--sub);margin:0 0 10px;font-weight:600;}
  .meals{display:flex;flex-direction:column;gap:8px;}
  .meal{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);}
  .meal.active{background:var(--accent-soft);border-color:var(--accent);}
  .meal .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0;}
  .meal.active .dot{background:var(--accent);}
  .meal .mname{flex:1;font-size:15px;}
  .meal .mtime{color:var(--sub);font-size:13px;}
  .status-line{font-size:14px;color:var(--sub);margin-top:10px;}
  .status-line.can{color:var(--accent);font-weight:600;}
  .status-line.cant{color:var(--warn);font-weight:600;}
  .hist{display:flex;flex-direction:column;gap:6px;}
  .hist-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-top:1px solid var(--line);}
  .hist-row:first-child{border-top:none;}
  .hist-cal{color:var(--sub);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Счётчик калорий</h1>
  <p class="sub">Записывай приёмы пищи, следи за дневной нормой и временем еды.</p>

  <div class="card">
    <div class="row">
      <div>
        <div class="progress-num" id="eatenNum">0</div>
        <div class="progress-label" id="progressLabel">из 2000 ккал сегодня</div>
      </div>
      <div class="goal-input">
        <label for="goalInput" style="font-size:13px;color:var(--sub);">Норма</label>
        <input type="number" id="goalInput" value="2000" min="0">
      </div>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
  </div>

  <div class="card">
    <h2>Добавить приём пищи</h2>
    <form class="add" id="addForm">
      <input type="text" id="foodName" placeholder="Например, овсянка с бананом" required>
      <input type="number" class="cal" id="foodCal" placeholder="ккал" min="0" required>
      <button type="submit">+</button>
    </form>
    <ul class="log" id="logList"></ul>
  </div>

  <div class="card">
    <h2>Режим питания</h2>
    <div class="meals" id="mealsList"></div>
    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="card">
    <h2>История</h2>
    <div class="hist" id="histList"></div>
  </div>
</div>

<script>
(function(){
  var todayKey = new Date().toISOString().slice(0,10);
  var store = {get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
               set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

  var goal = store.get('cal_goal', 2000);
  var entries = store.get('cal_entries_'+todayKey, []);
  var meals = [
    {name:'Завтрак', start:7, end:10},
    {name:'Обед', start:12, end:15},
    {name:'Ужин', start:18, end:20},
    {name:'После 21:00 — лучше не есть', start:21, end:24}
  ];

  var goalInput = document.getElementById('goalInput');
  var eatenNum = document.getElementById('eatenNum');
  var progressLabel = document.getElementById('progressLabel');
  var barFill = document.getElementById('barFill');
  var logList = document.getElementById('logList');
  var addForm = document.getElementById('addForm');
  var mealsList = document.getElementById('mealsList');
  var statusLine = document.getElementById('statusLine');
  var histList = document.getElementById('histList');

  goalInput.value = goal;
  goalInput.addEventListener('change', function(){
    goal = parseInt(goalInput.value)||0;
    store.set('cal_goal', goal);
    render();
  });

  addForm.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('foodName').value.trim();
    var cal = parseInt(document.getElementById('foodCal').value)||0;
    if(!name || cal<=0) return;
    entries.push({name:name, cal:cal, t:Date.now()});
    store.set('cal_entries_'+todayKey, entries);
    document.getElementById('foodName').value='';
    document.getElementById('foodCal').value='';
    render();
  });

  function removeEntry(idx){
    entries.splice(idx,1);
    store.set('cal_entries_'+todayKey, entries);
    render();
  }

  function renderLog(){
    logList.innerHTML='';
    if(entries.length===0){
      logList.innerHTML = '<li class="empty">Пока ничего не добавлено</li>';
      return;
    }
    entries.forEach(function(e,i){
      var li = document.createElement('li');
      li.innerHTML = '<span class="name"></span><span class="cal-val"></span><button class="del">✕</button>';
      li.querySelector('.name').textContent = e.name;
      li.querySelector('.cal-val').textContent = e.cal+' ккал';
      li.querySelector('.del').addEventListener('click', function(){removeEntry(i);});
      logList.appendChild(li);
    });
  }

  function renderProgress(){
    var eaten = entries.reduce(function(s,e){return s+e.cal;},0);
    eatenNum.textContent = eaten;
    progressLabel.textContent = 'из '+goal+' ккал сегодня';
    var pct = goal>0 ? Math.min(100, (eaten/goal)*100) : 0;
    barFill.style.width = pct+'%';
    barFill.className = 'bar-fill'+(eaten>goal ? ' over':'');
  }

  function renderMeals(){
    var now = new Date();
    var h = now.getHours() + now.getMinutes()/60;
    mealsList.innerHTML='';
    var activeMeal = null;
    meals.forEach(function(m){
      var isActive = h>=m.start && h<m.end;
      if(isActive) activeMeal = m;
      var div = document.createElement('div');
      div.className = 'meal'+(isActive?' active':'');
      var timeText = m.start+':00–'+m.end+':00';
      div.innerHTML = '<span class="dot"></span><span class="mname"></span><span class="mtime"></span>';
      div.querySelector('.mname').textContent = m.name;
      div.querySelector('.mtime').textContent = timeText;
      mealsList.appendChild(div);
    });
    if(activeMeal && activeMeal.name.indexOf('лучше не есть')===-1){
      statusLine.textContent = 'Сейчас время: '+activeMeal.name.toLowerCase();
      statusLine.className = 'status-line can';
    } else if(activeMeal){
      statusLine.textContent = 'Позднее время — по плану приёмов пищи уже нет';
      statusLine.className = 'status-line cant';
    } else {
      statusLine.textContent = 'Сейчас не по расписанию приёмов пищи';
      statusLine.className = 'status-line cant';
    }
  }

  function renderHistory(){
    var days = [];
    for(var i=1;i<=6;i++){
      var d = new Date();
      d.setDate(d.getDate()-i);
      var key = d.toISOString().slice(0,10);
      var list = store.get('cal_entries_'+key, []);
      if(list.length===0) continue;
      var total = list.reduce(function(s,e){return s+e.cal;},0);
      days.push({date:key, total:total});
    }
    histList.innerHTML='';
    if(days.length===0){
      histList.innerHTML = '<div class="empty">История появится со следующего дня</div>';
      return;
    }
    days.forEach(function(d){
      var row = document.createElement('div');
      row.className='hist-row';
      row.innerHTML = '<span></span><span class="hist-cal"></span>';
      var parts = d.date.split('-');
      row.querySelector('span').textContent = parts[2]+'.'+parts[1];
      row.querySelector('.hist-cal').textContent = d.total+' ккал';
      histList.appendChild(row);
    });
  }

  function render(){
    renderLog();
    renderProgress();
    renderMeals();
    renderHistory();
  }

  render();
  setInterval(renderMeals, 60000);
})();
</script>
</body>
</html>
